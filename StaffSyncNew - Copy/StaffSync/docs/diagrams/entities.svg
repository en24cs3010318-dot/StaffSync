="#46695b">manager → User</text><rect x="30" y="90" width="240" height="120" rx="12" fill="white" stroke="#94b3a3" stroke-width="1.5"/><text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#204b3d">Employee profile</text><text x="150" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">user → User (unique)</text><text x="150" y="170" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">address, designation, document</text><rect x="30" y="300" width="240" height="120" rx="12" fill="white" stroke="#94b3a3" stroke-width="1.5"/><text x="150" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#204b3d">Leave</text><text x="150" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">applicant / reviewer → User</text><text x="150" y="380" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">from, to, reason, status</text><rect x="30" y="510" width="240" height="120" rx="12" fill="white" stroke="#94b3a3" stroke-width="1.5"/><text x="150" y="540" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#204b3d">Attendance</text><text x="150" y="565" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">user → User</text><text x="150" y="590" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">date, checkIn, checkOut</text><rect x="730" y="90" width="240" height="120" rx="12" fill="white" stroke="#94b3a3" stroke-width="1.5"/><text x="850" y="120" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#204b3d">Training</text><text x="850" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">manager → User</text><text x="850" y="170" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">assignments: user + progress</text><rect x="730" y="300" width="240" height="120" rx="12" fill="white" stroke="#94b3a3" stroke-width="1.5"/><text x="850" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#204b3d">Announcement</text><text x="850" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">author → User</text><text x="850" y="380" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">title, body, createdAt</text><rect x="730" y="510" width="240" height="120" rx="12" fill="white" stroke="#94b3a3" stroke-width="1.5"/><text x="850" y="540" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#204b3d">Notification</text><text x="850" y="565" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">recipient → User</text><text x="850" y="590" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">message, read, createdAt</text><rect x="380" y="300" width="240" height="120" rx="12" fill="white" stroke="#94b3a3" stroke-width="1.5"/><text x="500" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#204b3d">User</text><text x="500" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">name, email, password hash</text><text x="500" y="380" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#204b3d">role, manager, active, deleted</text></svg>